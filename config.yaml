# ============================================================
# Real World API 接口自动化测试 —— 全局配置（唯一配置源）
#
# 支持环境变量覆盖（优先级：环境变量 > 本文件 > 内置默认值）：
#   APP_BASE_URL -> app.base_url
#   SWAGGER_URL  -> spec.swagger_url
# ============================================================

app:
  base_url: "http://127.0.0.1:8000/api"

spec:
  swagger_url: "http://127.0.0.1:8000/swagger/?format=openapi"
