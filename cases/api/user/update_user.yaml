# 更新当前用户接口 PUT /user
cases:
  - name: 正常更新bio
    json:
      user:
        email: __fixture_email__
        bio: __UUID__
        image: null
    expect:
      status_code: 200

  - name: 缺少email字段(缺陷,服务端KeyError->500)
    json:
      user:
        bio: "only bio"
    expect:
      status_code: 500
